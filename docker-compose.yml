services:
  db:
    image: postgres:16-alpine
    container_name: brewlite-old-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite_password
      POSTGRES_DB: brewlite_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./brewlite_database.sql:/docker-entrypoint-initdb.d/01-brewlite_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-old-backend
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite_password@db:5432/brewlite_db?schema=public
      JWT_SECRET: brewlite_super_secret_jwt_key_2026
      PORT: 4000
      FRONTEND_URL: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
    container_name: brewlite-old-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
    depends_on:
      - backend

volumes:
  postgres_data:
